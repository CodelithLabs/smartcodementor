<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartCodeMentor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🧠 SmartCodeMentor</h1>
    </header>
    <main class="container">
        <div class="editor-panel">
            <h2>Your Code</h2>
            <textarea id="code-editor" placeholder="Write your C++ code here..."></textarea>
            <div class="controls">
                <button id="run-btn">🚀 Run Code</button>
                <button id="hint-btn">💡 Get Hint</button>
            </div>
        </div>
        <div class="output-panel">
            <h2>Output</h2>
            <pre id="output-area">Your code's output will appear here.</pre>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
