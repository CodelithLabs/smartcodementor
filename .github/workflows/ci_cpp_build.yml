name: 🔥 C++ Ultimate Build & Test Pipeline

on:
  push:
    branches: [ main, dev, feature/** ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

# ===============================================================
# 🧩 Global Environment Configuration
# ===============================================================
env:
  BUILD_TYPE: Release
  CXX_STANDARD: 20
  BUILD_DIR: build
  SRC_DIR: src
  TEST_DIR: tests
  DOCS_DIR: docs
  COVERAGE_DIR: coverage
  EXECUTABLE_NAME: quiz_app
  CACHE_KEY_PREFIX: cpp-build-cache
  PROJECT_NAME: "Quiz Master Pro"
  DOXYGEN_CONFIG: Doxyfile
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ===============================================================
# ⚙️ Jobs Section
# ===============================================================

jobs:
  # =============================================================
  # 1️⃣ LINTING + STATIC ANALYSIS JOB
  # =============================================================
  lint-and-analyze:
    name: 🔍 Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: 🛠 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Install Tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cppcheck clang-tidy

      - name: 🧠 Run cppcheck
        run: |
          echo "Running static analysis with cppcheck..."
          cppcheck --enable=all --inconclusive --std=c++20 --quiet ${{ env.SRC_DIR }} 2> cppcheck-report.txt
          echo "📋 cppcheck report generated."

      - name: 🤖 Run clang-tidy
        run: |
          echo "Running clang-tidy..."
          clang-tidy ${{ env.SRC_DIR }}/**/*.cpp -- -std=c++20 || true
          echo "✅ clang-tidy completed."

      - name: 🧾 Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            cppcheck-report.txt
            .clang-tidy

  # =============================================================
  # 2️⃣ BUILD JOB
  # =============================================================
  build:
    name: 🧩 Build C++ Project
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 🛠 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup C++ Environment
        run: |
          echo "Setting up C++ compiler for ${{ matrix.os }}"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update -y
            sudo apt-get install g++ cmake ninja-build lcov -y
          elif [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            choco install mingw cmake ninja -y
          else
            brew install cmake ninja
          fi

      - name: 🧱 Cache Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.BUILD_DIR }}
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}

      - name: 🧩 Configure with CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} -G Ninja

      - name: 🧰 Build Project
        run: cmake --build ${{ env.BUILD_DIR }} --target all -j 4

      - name: 🧪 Run Executable Smoke Test
        run: |
          echo "Running ${{ env.EXECUTABLE_NAME }}..."
          cd ${{ env.BUILD_DIR }}
          ./quiz_app || echo "Executable test finished with custom exit."

      - name: 🧾 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}

  # =============================================================
  # 3️⃣ TEST JOB (WITH COVERAGE)
  # =============================================================
  test:
    name: 🧪 Run Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🛠 Checkout Code
        uses: actions/checkout@v4

      - name: ⚡ Setup Dependencies
        run: sudo apt-get install -y g++ cmake lcov

      - name: 🧱 Build with Coverage
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
          cmake --build ${{ env.BUILD_DIR }}

      - name: 🧪 Run Tests
        run: |
          cd ${{ env.BUILD_DIR }}
          ctest --output-on-failure

      - name: 📈 Generate Coverage Report
        run: |
          lcov --directory . --capture --output-file coverage.info
          lcov --remove coverage.info '/usr/*' --output-file coverage.info
          genhtml coverage.info --output-directory ${{ env.COVERAGE_DIR }}

      - name: 📤 Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.COVERAGE_DIR }}

  # =============================================================
  # 4️⃣ DOCUMENTATION DEPLOYMENT JOB
  # =============================================================
  docs:
    name: 📚 Build and Deploy Documentation
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: 🛠 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Install Doxygen
        run: sudo apt-get install doxygen graphviz -y

      - name: 📘 Generate Documentation
        run: |
          doxygen ${{ env.DOXYGEN_CONFIG }}
          echo "Documentation generated successfully."

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          commit_message: "📚 Auto-update Doxygen documentation"

  # =============================================================
  # 5️⃣ CODE QUALITY BADGES & SUMMARY
  # =============================================================
  summary:
    name: 🧾 Generate Pipeline Summary
    needs: [lint-and-analyze, build, test, docs]
    runs-on: ubuntu-latest
    steps:
      - name: 🧠 Generate Fun Summary
        run: |
          echo "### 🏗️ Project: ${{ env.PROJECT_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔹 Build Type: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "#### 🧩 Language: C++${{ env.CXX_STANDARD }}" >> $GITHUB_STEP_SUMMARY
          echo "#### 🚦 Linting: Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "#### 🧪 Tests: Completed ✅" >> $GITHUB_STEP_SUMMARY
          echo "#### 📈 Coverage: See uploaded artifact" >> $GITHUB_STEP_SUMMARY
          echo "#### 📚 Docs: Published on gh-pages 🌐" >> $GITHUB_STEP_SUMMARY
          echo "#### 🏁 OS: Cross-platform (Linux/Win/macOS)" >> $GITHUB_STEP_SUMMARY
          echo "#### 🧠 Fun Fact: Compiling teaches patience 😉" >> $GITHUB_STEP_SUMMARY

      - name: 🎉 Celebrate Success
        run: |
          echo "🎇 Build Pipeline Complete!"
          echo "Thank you for contributing to ${{ env.PROJECT_NAME }}!"
          echo "Keep coding, keep improving 🚀"

