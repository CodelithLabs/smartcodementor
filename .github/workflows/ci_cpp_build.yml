# ====================================================================
# 🚀 SmartCodeMentor - Cross-Platform C++ CI/CD Pipeline
# Author: Prasanta Ray & GPT-5
# ====================================================================

name: 🧩 SmartCodeMentor CI/CD

on:
  push:
    branches: [main, dev, feature/**]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CXX_STANDARD: 20
  BUILD_DIR: build
  EXECUTABLE_NAME: quiz_app
  PROJECT_NAME: SmartCodeMentor

jobs:
  # ==============================================================
  # 1️⃣ Lint + Static Analysis
  # ==============================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          cppcheck --enable=all --std=c++20 --quiet src || true
          clang-tidy src/**/*.cpp -- -std=c++20 || true

  # ==============================================================
  # 2️⃣ Cross-Platform Build Matrix
  # ==============================================================
  build:
    name: 🏗️ Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: ⚙️ Setup C++ Environment (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ ninja-build
        shell: bash

      - name: ⚙️ Setup C++ Environment (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw cmake ninja -y
        shell: pwsh

      - name: ⚙️ Setup C++ Environment (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake ninja
        shell: bash

      - name: 🧱 Configure CMake
        run: |
          cmake -B ${{ env.BUILD_DIR }} -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }}
        shell: bash

      - name: 🚀 Build Project
        run: cmake --build ${{ env.BUILD_DIR }} --target quiz_app -j 4
        shell: bash

      - name: 🧩 Smoke Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd ${{ env.BUILD_DIR }}
          ./quiz_app || echo "✅ App executed."
        shell: bash

      - name: 🧩 Smoke Test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd ${{ env.BUILD_DIR }}
          ./quiz_app.exe || echo "✅ App executed."
        shell: pwsh

      - name: 📦 Upload Artifact (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SmartCodeMentor-${{ matrix.os }}
          path: build/quiz_app

      - name: 📦 Upload Artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: SmartCodeMentor-${{ matrix.os }}
          path: build/quiz_app.exe

  # ==============================================================
  # 3️⃣ Unit Testing + Coverage
  # ==============================================================
  test:
    name: 🧪 Unit Tests & Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y g++ cmake lcov
          cmake -B build -S . -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON
          cmake --build build
          cd build && ctest --output-on-failure
          lcov --directory . --capture --output-file coverage.info
          genhtml coverage.info --output-directory coverage
      - uses: actions/upload-artifact@v4
        with:
          name: Coverage-Report
          path: coverage

  # ==============================================================
  # 4️⃣ Documentation (Doxygen)
  # ==============================================================
  docs:
    name: 📚 Generate & Deploy Docs
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y doxygen graphviz
          doxygen Doxyfile || echo "No Doxygen config found."
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/html
          publish_branch: gh-pages
          commit_message: "📚 Auto-update Doxygen Docs"

  # ==============================================================
  # 5️⃣ Summary
  # ==============================================================
  summary:
    name: 🧾 Build Summary
    needs: [lint, build, test, docs]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### 🏗️ Project: SmartCodeMentor" >> $GITHUB_STEP_SUMMARY
          echo "- Build Type: ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- C++ Standard: C++${{ env.CXX_STANDARD }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: Uploaded ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: Deployed 🌐" >> $GITHUB_STEP_SUMMARY
          echo "- OS: Cross-platform ✅" >> $GITHUB_STEP_SUMMARY
          echo "- Keep coding, keep improving 🚀" >> $GITHUB_STEP_SUMMARY
