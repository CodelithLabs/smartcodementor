# ================================================================
# 🚀 SmartCodeMentor CI/CD (Cross-Platform, Fixed Version)
# ================================================================

name: SmartCodeMentor CI/CD

on:
  push:
    branches: [main, dev]
    tags: [ 'v*.*.*' ] # <-- ADDED: This lets the workflow run on tags
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CXX_STANDARD: 20
  BUILD_DIR: build
  EXECUTABLE_NAME: quiz_app

permissions: # <-- ADDED: This gives the workflow permission to create a release
  contents: write

# ================================================================
# 1️⃣ Lint Job (Ubuntu Only)
# ================================================================
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout Source
        uses: actions/checkout@v4

      - name: 🔍 Static Analysis (cppcheck + clang-tidy)
        continue-on-error: true # Cleaner error handling
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          cppcheck --enable=all --std=c++20 --quiet src
          clang-tidy src/**/*.cpp -- -std=c++20
# ================================================================
# 2️⃣ Cross-Platform Build & Test Matrix
# ================================================================
  build:
    name: 🏗️ Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 🧩 Checkout Source
        uses: actions/checkout@v4

      # 🐧 Linux setup
      - name: 🛠️ Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ ninja-build lcov
      
      # 🪟 Windows setup
      - name: 🪟 Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw ninja -y
          # This is the crucial fix for the Windows PATH
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "✅ Installed MinGW/Ninja and added to PATH."
      
      # 🍎 macOS setup
      - name: 🍎 Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
      
      # 🧱 Configure & Build (cross-platform)
      - name: ⚙️ Configure Project with CMake
        run: |
          # Put CMake command on a single line for cross-platform compatibility
          cmake -B ${{ env.BUILD_DIR }} -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} -DENABLE_TESTS=ON
      
      - name: 🚀 Build Project
        # Removed '--target quiz_app' to build all targets (inc. tests)
        run: cmake --build ${{ env.BUILD_DIR }} -j 4

      - name: 🧪 Run Unit Tests
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure
      
      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCodeMentor-${{ matrix.os }}
          path: build/quiz_app*

# ================================================================
# 3️⃣ Code Coverage (Ubuntu only)
# ================================================================
  coverage:
    name: 📊 Generate Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ cmake lcov
          cmake -B build -S . -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON
          cmake --build build
          cd build && ctest --output-on-failure
          lcov --directory . --capture --output-file coverage.info
          genhtml coverage.info --output-directory coverage
      - uses: actions/upload-artifact@v4
        with:
          name: Coverage-Report
          path: coverage

# ================================================================
# 4️⃣ Docs (Doxygen)
# ================================================================
  docs:
    name: 📚 Build Documentation
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y doxygen graphviz
          if [ -f Doxyfile ]; then
            doxygen Doxyfile
          else
            echo "⚠️ No Doxyfile found. Skipping docs."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: docs/html

# ================================================================
# 5️⃣ Sanitizer Job (Ubuntu only) <-- NEW JOB
# ================================================================
  sanitize:
    name: 🔬 Run Sanitizers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🛠️ Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ ninja-build
          
      - name: ⚙️ Configure Project (Debug + Sanitizers)
        run: |
          # We use CMAKE_BUILD_TYPE=Debug for the best sanitizer output
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_TESTS=ON \
            -DENABLE_SANITIZERS=ON

      - name: 🚀 Build Project
        run: cmake --build build -j 4
        
      - name: 🧪 Run Sanitized Tests
        working-directory: build
        run: ctest --output-on-failure

# ================================================================
# 6️⃣ Create Release (On Tag Push) <-- NEW JOB
# ================================================================
  release:
    name: 📦 Create GitHub Release
    if: github.ref_type == 'tag' # <-- Only runs this job on tag pushes
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/ # Downloads all artifacts into a folder named 'artifacts'
          
      - name: 🏗️ Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          # This automatically uses the tag name as the release title
          # and the git commit message as the description
          files: |
            artifacts/SmartCodeMentor-ubuntu-latest/quiz_app
            artifacts/SmartCodeMentor-windows-latest/quiz_app.exe
            artifacts/SmartCodeMentor-macos-latest/quiz_app