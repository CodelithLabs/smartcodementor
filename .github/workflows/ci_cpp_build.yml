# ================================================================
# 🚀 SmartCodeMentor CI/CD (Cross-Platform, Fixed Version)
# ================================================================

name: SmartCodeMentor CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CXX_STANDARD: 20
  BUILD_DIR: build
  EXECUTABLE_NAME: quiz_app

# ================================================================
# 1️⃣ Lint Job (Ubuntu Only)
# ================================================================
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: 🧩 Checkout Source
        uses: actions/checkout@v4

      - name: 🔍 Static Analysis (cppcheck + clang-tidy)
        continue-on-error: true # <-- MODIFIED (Cleaner error handling)
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-tidy
          cppcheck --enable=all --std=c++20 --quiet src
          clang-tidy src/**/*.cpp -- -std=c++20
# ================================================================
# 2️⃣ Cross-Platform Build & Test Matrix
# ================================================================
  build:
    name: 🏗️ Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: 🧩 Checkout Source
        uses: actions/checkout@v4

      # 🐧 Linux setup
      - name: 🛠️ Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake g++ ninja-build lcov
      
      # 🪟 Windows setup
      - name: 🪟 Install dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install mingw ninja -y
          # <-- MODIFIED: This is the crucial fix for the Windows PATH
          echo "C:\tools\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "✅ Installed MinGW/Ninja and added to PATH."
      
      # 🍎 macOS setup
      - name: 🍎 Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja
      
      # 🧱 Configure & Build (cross-platform)
- name: ⚙️ Configure Project with CMake
        run: |
          # <-- MODIFIED: Put CMake command on a single line for cross-platform compatibility
          cmake -B ${{ env.BUILD_DIR }} -S . -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_CXX_STANDARD=${{ env.CXX_STANDARD }} -DENABLE_TESTS=ON
      
      - name: 🚀 Build Project
        # <-- MODIFIED: Removed '--target quiz_app' to build all targets (inc. tests)
        run: cmake --build ${{ env.BUILD_DIR }} -j 4

      - name: 🧪 Run Unit Tests
        # <-- NEW STEP: Run tests on all 3 platforms
        working-directory: ${{ env.BUILD_DIR }}
        run: ctest --output-on-failure
      
      # <-- REMOVED: The 'Smoke Test' step is no longer needed as ctest handles it.

      - name: 📦 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCodeMentor-${{ matrix.os }}
          path: build/quiz_app*

# ================================================================
# 3️⃣ Code Coverage (Ubuntu only)
# ================================================================
  coverage: # <-- MODIFIED: Renamed 'test' job to 'coverage' for clarity
    name: 📊 Generate Coverage
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ cmake lcov
          # This step correctly enables coverage flags
          cmake -B build -S . -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON
          cmake --build build
          cd build && ctest --output-on-failure
          lcov --directory . --capture --output-file coverage.info
          genhtml coverage.info --output-directory coverage
      - uses: actions/upload-artifact@v4
        with:
          name: Coverage-Report
          path: coverage

# ================================================================
# 4️⃣ Docs (Doxygen)
# ================================================================
  docs:
    name: 📚 Build Documentation
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get install -y doxygen graphviz
          if [ -f Doxyfile ]; then
            doxygen Doxyfile
          else
            echo "⚠️ No Doxyfile found. Skipping docs."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Docs
          path: docs/html
